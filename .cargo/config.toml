[alias]
xtask = "run -q -p xtask --"
# `cargo f` — быстрая сборка клиента (профиль fast, с символами для samply) -> target/fast/ezzmc-client
f = "build --profile fast -p ezzmc-client"

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
