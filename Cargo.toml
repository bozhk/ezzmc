[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/net",
    "crates/world",
    "crates/mesh",
    "crates/render",
    "crates/assets",
    "crates/client",
    "crates/auth",
    "crates/launcher",
    "xtask",
    "benches",
    "tests-integration",
]
default-members = ["crates/client"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"

# Внутренние зависимости крейтов
[workspace.dependencies]
crossbeam-channel = "0.5"
rayon = "1"
wgpu = { version = "28", default-features = false, features = ["wgsl", "vulkan", "gles", "dx12", "metal", "std"] }
pollster = "0.4"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter", "ansi"] }
ezzmc-protocol = { path = "crates/protocol" }
ezzmc-net = { path = "crates/net" }
ezzmc-world = { path = "crates/world" }
ezzmc-mesh = { path = "crates/mesh" }
ezzmc-render = { path = "crates/render" }
ezzmc-assets = { path = "crates/assets" }
ezzmc-auth = { path = "crates/auth" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Горячие крейты оптимизируем и в dev, остальное — быстрая сборка
[profile.dev]
opt-level = 1
[profile.dev.package.ezzmc-protocol]
opt-level = 3
[profile.dev.package.ezzmc-net]
opt-level = 3
[profile.dev.package.ezzmc-world]
opt-level = 3
[profile.dev.package.ezzmc-mesh]
opt-level = 3
# wgpu-core 28.0.1: debug_assert в батчинге multi-draw-indirect (render.rs:2914) падает на DX12/Metal
# в debug-тестах render (путь ComputeIndirect). Это sanity-проверка смещений, не корректность; отключаем
# только для wgpu-core в dev-профиле.
[profile.dev.package.wgpu-core]
debug-assertions = false

[profile.bench]
inherits = "release"
debug = false
strip = "none"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

# Быстрая сборка для повседневной проверки: `cargo build --profile fast -p ezzmc-client`
[profile.fast]
inherits = "release"
lto = "off"
codegen-units = 16
incremental = true
# Символы для samply (имена функций в профиле)
debug = "line-tables-only"
strip = "none"
